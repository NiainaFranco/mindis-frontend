<div>
  <app-breadcrumb [links]="breadCrumbRoutes"></app-breadcrumb>
  <div class="p-3">
    <div>
      <div>
        <div>
          <h2 class="text-2xl p-2">Table Panel</h2>
          <div class="w-full flex-wrap flex">
            <app-table-search-input
              label="Filter by Name"
              placeHolder="Ex: blue, red, velv..."
              [change]="handleFilterByName.bind(this)"
            ></app-table-search-input>
          </div>
        </div>
      </div>
      <div class="w-full py-2 flex justify-end">
        <button (click)="handleOpenCreationDialogue()" matButton="filled">New color</button>
      </div>
      <div class="rounded-lg px-2 overflow-hidden border border-gray-400">
        @if(ribonColorsData$()){
        <table
          mat-table
          [dataSource]="ribonColorsData$() || []"
          matSort
          (matSortChange)="handleFilterSort($event)"
        >
          <ng-container matColumnDef="name">
            <th mat-header-cell mat-sort-header="name" *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let ribonColor">{{ribonColor.name}}</td>
          </ng-container>
          <ng-container matColumnDef="color">
            <th mat-header-cell *matHeaderCellDef>Color</th>
            <td mat-cell *matCellDef="let ribonColor">
              <span
                class="p-3 w-[20px] h-[5px] rounded-lg"
                [style.background-color]="ribonColor.color"
              >
                <span class=""> {{ribonColor.color}} </span>
              </span>
            </td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let ribonColor">
              <div class="flex gap-2">
                <button
                  matMiniFab="filled"
                  (click)="handleDeleteRow(ribonColor.id)"
                  class="btn-fab-warn"
                >
                  <mat-icon svgIcon="dashboard:delete"></mat-icon>
                </button>
                <button matMiniFab="filled" (click)="handleEditRow(ribonColor)">
                  <mat-icon svgIcon="dashboard:edit"></mat-icon>
                </button>
              </div>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="ribonColorsHeaders$"></tr>
          <tr mat-row *matRowDef="let row; columns: ribonColorsHeaders$;"></tr>
        </table>
        }
      </div>
      <mat-paginator
        (page)="handlePageEvent($event)"
        [length]="ribonColorsRessource$.value()?.meta?.totalCount"
        [pageSizeOptions]="[10,30,50,100]"
        [disabled]="ribonColorsRessource$.status() != 'resolved'"
        aria-label="Select page of ribon colors."
      ></mat-paginator>
    </div>
  </div>
</div>
