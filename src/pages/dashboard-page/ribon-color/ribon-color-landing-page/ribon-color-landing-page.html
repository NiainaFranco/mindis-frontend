<div>
  <app-breadcrumb [links]="breadCrumbRoutes"></app-breadcrumb>
  <div class="p-3">
      <div class="rounded-xl px-2 overflow-hidden border border-gray-300">
        @if(ribonColorsRessource$.status() == "resolved"){
          <table mat-table [dataSource]="ribonColorsRessource$.value()?.data || []">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef> Name </th>
              <td mat-cell *matCellDef="let ribonColor"> {{ribonColor.name}} </td>
            </ng-container>
            <ng-container matColumnDef="color">
              <th mat-header-cell *matHeaderCellDef> Color </th>
              <td mat-cell *matCellDef="let ribonColor">
                <span class="p-3 w-[20px] h-[5px] rounded-lg" [style.background-color]="ribonColor.color" >
                  <span class="">
                    {{ribonColor.color}}
                  </span>
                </span>
              </td>
            </ng-container>
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef> Actions </th>
              <td mat-cell *matCellDef="let ribonColor">
                <button matMiniFab="filled" class="warn-fab-btn">
                  <mat-icon svgIcon="dashboard:delete"></mat-icon>
                </button>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="ribonColorsHeaders$"></tr>
            <tr mat-row *matRowDef="let row; columns: ribonColorsHeaders$;"></tr>
          </table>
        }
        <mat-paginator
            (page)="handlePageEvent($event)"
            [length]="ribonColorsRessource$.value()?.meta?.totalCount"
            [pageSizeOptions]="[10,30,50,100]"
            [disabled]="ribonColorsRessource$.status() != 'resolved'"
            aria-label="Select page of ribon colors."
        ></mat-paginator>
      </div>
  </div>
</div>
