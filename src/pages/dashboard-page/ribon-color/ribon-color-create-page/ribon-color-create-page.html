<div>
  <app-breadcrumb  [links]="breadcrumbRoutes" ></app-breadcrumb>
  <div class="p-2">
    <form (submit)="submit($event)">
      <app-form-input label="Name" [inputControl]="name" placeholder="Ex: red, blue" [errorMessage]="nameErrorMessage()" ></app-form-input>
      <input type="color" [formControl]="color" />

      <button matButton="filled" type="submit">Create</button>
    </form>
  </div>
</div>
