  <h2 matDialogTitle>Create color</h2>
  <mat-dialog-content>
  <div class="p-2">
    <app-form-input label="Name" [inputControl]="name" placeholder="Ex: red, blue"
      [errorMessage]="nameErrorMessage()"></app-form-input>
    <input type="color" [formControl]="color" />
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="filled" (click)="onCreateClick()">Create</button>
  <button matButton="outlined" type="submit" (click)="onCloseClick()">Close</button>
</mat-dialog-actions>
