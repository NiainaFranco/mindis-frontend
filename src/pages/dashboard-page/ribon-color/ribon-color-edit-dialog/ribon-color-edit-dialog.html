<h2 matDialogTitle>Edit color</h2>
<mat-dialog-content>
  <div class="p-2">
    <app-form-input label="Name" [inputControl]="name" placeholder="Ex: red, blue"></app-form-input>
    <input type="color" [formControl]="color" />
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="filled" (click)="onOkClick()">Ok</button>
  <button matButton="outlined" type="submit" (click)="onCloseClick()">Close</button>
</mat-dialog-actions>
