<main>
  <div><app-breadcrumb [links]="breadCrumbLinks"></app-breadcrumb></div>
  <div>
    @if(productsRessource$.hasValue()){ @for(product of productsRessource$.value().data ; track
    $index){
    <div>
      {{product.name}}
      <button (click)="editProduct(product)">edit</button>
      <a [routerLink]="['show-one', product.id]">more</a>
    </div>
    } }
    <a matButton="filled" routerLink="/dashboard/products/create">New Product</a>
  </div>
</main>
