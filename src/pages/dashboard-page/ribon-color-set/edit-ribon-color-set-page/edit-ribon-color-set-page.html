<main>
  <div>
    <app-breadcrumb [links]="breadcrumbLinks"></app-breadcrumb>
  </div>
  <form action="" (submit)="updateRibonColorSet($event)">
    <input type="text" [formControl]="nameForm" >
    <div>
      @if(ribonColorsData$()){
        @for(ribonColor of ribonColorsData$() ; track $index){
          <div>
            <label for="">{{ribonColor.name}}</label>
            <div class="p-3" [style.background-color]="ribonColor.color"></div>
            <input (change)="addOrRemoveRibonColor(ribonColor)" [checked]="ribonColorsMap$().has(ribonColor.id)" type="checkbox" name="" [value]="ribonColor.id">
          </div>
        }
      }
    </div>
    <div>
      @if(ribonColorsToAddArray$()){
        @for(ribonColor of ribonColorsToAddArray$() ; track $index){
          <div>
            <label for="">{{ribonColor.name}}</label>
            <div class="p-3" [style.background-color]="ribonColor.color"></div>
          </div>
        }
      }
    </div>
    <button matButton="filled" type="submit" >create</button>
  </form>

</main>
