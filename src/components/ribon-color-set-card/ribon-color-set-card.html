<mat-card appearance="outlined">
  <mat-card-header>
    {{ribonColorSet.name}}
  </mat-card-header>
  <mat-card-content>
    @for (item of ribonColorSet.ribonColors; track $index) {
      <app-ribon-color-display [ribonColor]="item"></app-ribon-color-display>
    }
  </mat-card-content>
  <mat-card-actions>
    <button matMiniFab="filled" class="btn-fab-warn">
      <mat-icon svgIcon="dashboard:delete"></mat-icon>
    </button>
    <button matMiniFab>
      <mat-icon svgIcon="dashboard:edit"></mat-icon>
    </button>
  </mat-card-actions>
</mat-card>
