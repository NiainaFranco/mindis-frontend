<div class="px-1 py-1 border-b border-b-gray-300 shadow-sm">
  <div class="flex items-center">
    @for(link of links.sort((a,b)=>(a.order - b.order));track $index){
     <a [routerLink]="link.routerLink" [disabled]="!link.routerLink" matButton="text" class="block">{{link.routeName}}</a>
      @if($index < (links.length - 1) ){
        <mat-icon svgIcon="breadcrumb:chevron-right"></mat-icon>
      }
    }
  </div>
</div>
